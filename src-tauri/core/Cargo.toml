[package]
name = "life_db_core"
version = "0.1.0"
edition = "2024"

[dependencies]
aes-gcm = "0.11.1"
argon2 = "0.6.0"
base64 = "0.23.1"
getrandom = "0.4.3"
hex = "0.4.3"
keyring = "4.2.0"
rusqlite = { version = "0.41.1", features = ["backup", "bundled-sqlcipher-vendored-openssl"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
unicode-normalization = "0.1.26"
zeroize = "1.9.2"

[dev-dependencies]
tempfile = "3.27.0"
