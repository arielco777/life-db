[package]
name = "life-db"
version = "0.1.0"
description = "Life DB — a personal life notebook"
edition = "2024"

[lib]
name = "life_db_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
life_db_core = { path = "core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-dialog = "2.8.4"
tauri-plugin-opener = "2.7.3"

[workspace]
members = ["core"]
