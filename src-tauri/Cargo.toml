[package]
name = "life-db"
version = "0.1.0"
description = "Life DB — a personal life notebook"
edition = "2024"

[lib]
name = "life_db_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.5", features = [] }

[workspace]
members = []
